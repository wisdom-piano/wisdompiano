<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wisdom Piano 학부모용 레슨 리포트</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#eeeae3;color:#28231e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",Arial,sans-serif}
.actions{position:sticky;top:0;z-index:10;display:flex;gap:8px;justify-content:center;padding:10px;background:rgba(255,255,255,.96);border-bottom:1px solid #e8dfd2}
.actions button{border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:15px}
.back{background:#eee7dd;color:#332d27}.print{background:#b88b4a;color:#fff}
.sheet{position:relative;width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:15mm 17mm 31mm;box-shadow:0 5px 24px rgba(0,0,0,.08)}
.top{display:grid;grid-template-columns:31mm 1fr;gap:9mm;align-items:center}
.logo{width:30mm;height:30mm;object-fit:contain}
.kicker{font-size:8.5pt;letter-spacing:2.2px;font-weight:800;color:#a77b3f;margin-bottom:3mm}
h1{font-size:22pt;line-height:1.15;margin:0 0 2mm;font-weight:750}
.meta{font-size:9.5pt;color:#756c62}
.goldline{height:1.5px;background:#b88b4a;margin:5.5mm 0 7mm}
.info{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e5d9c8;border-radius:11px;overflow:hidden}
.cell{min-height:25mm;padding:5mm;background:#fcf9f4;border-right:1px solid #e5d9c8;border-bottom:1px solid #e5d9c8}
.cell:nth-child(2n){border-right:0}.cell:nth-child(n+3){border-bottom:0}
.label{display:block;font-size:8pt;color:#807469;margin-bottom:2mm}
.value{display:block;font-size:10.5pt;line-height:1.45;font-weight:750}
.section{margin-top:7mm}
.section h2{font-size:11pt;color:#a77b3f;margin:0 0 2.5mm}
.box{min-height:18mm;padding:4mm 5mm;background:#fcf9f4;border-left:2.5px solid #b88b4a;font-size:10pt;line-height:1.7;white-space:pre-wrap}
.footer{position:absolute;left:17mm;right:17mm;bottom:9mm;text-align:center;color:#7d7368}
.footer .rule{border-top:1px solid #e5d9c8;margin-bottom:2.5mm}
.footer img{display:block;width:18mm;height:18mm;object-fit:contain;margin:0 auto 1mm}
.footer div:last-child{font-size:6.5pt;letter-spacing:1.4px}
@media(max-width:850px){.sheet{width:100%;min-height:auto;margin:0;box-shadow:none;padding:24px 20px 105px}.top{grid-template-columns:88px 1fr;gap:16px}.logo{width:84px;height:84px}.footer{left:20px;right:20px}}
@media print{
  html,body{width:210mm!important;margin:0!important;padding:0!important;background:#fff!important}
  .actions{display:none!important}
  .sheet{width:210mm!important;height:297mm!important;min-height:297mm!important;margin:0!important;padding:15mm 17mm 31mm!important;box-shadow:none!important;overflow:hidden!important}
  .info,.cell,.box{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .section,.info,.footer{break-inside:avoid!important;page-break-inside:avoid!important}
  @page{size:A4 portrait;margin:0}
}
</style></head>
<body>
<div class="actions"><button class="back" onclick="history.back()">← 앱으로 돌아가기</button><button class="print" onclick="window.print()">이 리포트 인쇄</button></div>
<article class="sheet">
<header class="top"><img class="logo" src="icon-512.png" alt="Wisdom Piano"><div><div class="kicker">PIANO LESSON REPORT</div><h1 id="student">학생 레슨 리포트</h1><div class="meta" id="meta"></div></div></header>
<div class="goldline"></div>
<section class="info">
<div class="cell"><span class="label">교재 / 진도</span><strong class="value" id="book">-</strong></div>
<div class="cell"><span class="label">연주곡</span><strong class="value" id="piece">-</strong></div>
<div class="cell"><span class="label">스케일 / 테크닉</span><strong class="value" id="tech">-</strong></div>
<div class="cell"><span class="label">완성도</span><strong class="value" id="progress">-</strong></div>
</section>
<section class="section"><h2>오늘의 레슨</h2><div class="box" id="note">-</div></section>
<section class="section"><h2>이번 주 연습 과제</h2><div class="box" id="homework">-</div></section>
<section class="section"><h2>다음 레슨 계획</h2><div class="box" id="next">-</div></section>
<footer class="footer"><div class="rule"></div><img src="icon-512.png" alt="Wisdom Piano"><div>WISDOM PIANO · MUSIC STUDIO</div></footer>
</article>
<script>
const r=JSON.parse(localStorage.getItem('wisdomPianoParentReport')||'{}');
const put=(id,v)=>document.getElementById(id).textContent=v||'-';
put('student',(r.student||'')+' 학생');
document.getElementById('meta').textContent=[r.date,r.attendance].filter(Boolean).join('  |  ');
put('book',r.book);put('piece',r.piece);put('tech',r.tech);put('progress',r.progress);
put('note',r.note);put('homework',r.homework);put('next',r.next);
</script></body></html>
