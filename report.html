<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wisdom Piano 학부모용 레슨 리포트</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#eeeae3;color:#28231e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",Arial,sans-serif}
.actions{position:sticky;top:0;z-index:10;display:flex;gap:8px;justify-content:center;padding:10px;background:rgba(255,255,255,.96);border-bottom:1px solid #e8dfd2}
.actions button{border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:15px}
.back{background:#eee7dd;color:#332d27}.print{background:#b88b4a;color:#fff;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.print:active{transform:scale(.98)}
.sheet{position:relative;width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:15mm 17mm 31mm;box-shadow:0 5px 24px rgba(0,0,0,.08)}
.top{display:grid;grid-template-columns:31mm 1fr;gap:9mm;align-items:center}
.logo{width:30mm;height:30mm;object-fit:contain}
.kicker{font-size:8.5pt;letter-spacing:2.2px;font-weight:800;color:#a77b3f;margin-bottom:3mm}
h1{font-size:22pt;line-height:1.15;margin:0 0 2mm;font-weight:750}
.meta{font-size:9.5pt;color:#756c62}
.goldline{height:1.5px;background:#b88b4a;margin:5.5mm 0 7mm}
.info{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e5d9c8;border-radius:11px;overflow:hidden}
.cell{min-height:25mm;padding:5mm;background:#fcf9f4;border-right:1px solid #e5d9c8;border-bottom:1px solid #e5d9c8}
.cell:nth-child(2n){border-right:0}.cell:nth-child(n+3){border-bottom:0}
.label{display:block;font-size:8pt;color:#807469;margin-bottom:2mm}
.value{display:block;font-size:10.5pt;line-height:1.45;font-weight:750}
.section{margin-top:7mm}
.section h2{font-size:11pt;color:#a77b3f;margin:0 0 2.5mm}
.box{min-height:18mm;padding:4mm 5mm;background:#fcf9f4;border-left:2.5px solid #b88b4a;font-size:10pt;line-height:1.7;white-space:pre-wrap}
.footer{position:absolute;left:17mm;right:17mm;bottom:9mm;text-align:center;color:#7d7368}
.footer .rule{border-top:1px solid #e5d9c8;margin-bottom:2.5mm}
.footer img{display:block;width:18mm;height:18mm;object-fit:contain;margin:0 auto 1mm}
.footer div:last-child{font-size:6.5pt;letter-spacing:1.4px}
@media(max-width:850px){.sheet{width:100%;min-height:auto;margin:0;box-shadow:none;padding:24px 20px 105px}.top{grid-template-columns:88px 1fr;gap:16px}.logo{width:84px;height:84px}.footer{left:20px;right:20px}}


.savebtn{background:#b88b4a;color:#fff;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.save-status{max-width:760px;margin:10px auto;padding:12px 16px;background:#fff7e8;border:1px solid #dfc18f;border-radius:12px;font-size:14px;text-align:center}
.save-status.hidden{display:none}

.sheet.jpg-capture{
 box-sizing:border-box!important;width:1240px!important;height:1754px!important;min-height:1754px!important;
 max-width:none!important;margin:0!important;padding:82px 92px 48px!important;background:#fff!important;
 overflow:hidden!important;position:relative!important;font-family:Arial,"Noto Sans KR",sans-serif!important;
}
.sheet.jpg-capture .report-top{display:flex!important;align-items:flex-start!important;gap:34px!important;margin:0 0 78px!important}
.sheet.jpg-capture .report-top img{width:130px!important;height:130px!important;object-fit:contain!important}
.sheet.jpg-capture .report-title{padding-top:5px!important}
.sheet.jpg-capture .report-title .eyebrow{font-size:17px!important;letter-spacing:4px!important;margin-bottom:13px!important}
.sheet.jpg-capture .report-title h1{font-size:44px!important;line-height:1.05!important;margin:0 0 20px!important}
.sheet.jpg-capture .report-title .meta{font-size:20px!important;color:#777!important}
.sheet.jpg-capture .info-grid{height:300px!important;margin:0 0 42px!important;border-radius:20px!important;overflow:hidden!important}
.sheet.jpg-capture .info-cell{padding:35px 32px!important}
.sheet.jpg-capture .info-label{font-size:17px!important;margin-bottom:16px!important}
.sheet.jpg-capture .info-value{font-size:23px!important;line-height:1.35!important;font-weight:700!important}
.sheet.jpg-capture .section{margin:0 0 38px!important}
.sheet.jpg-capture .section h2{font-size:25px!important;margin:0 0 18px!important}
.sheet.jpg-capture .section-box{min-height:132px!important;padding:25px 30px!important;font-size:21px!important;line-height:1.65!important}
.sheet.jpg-capture .report-footer{
 position:absolute!important;left:24px!important;right:24px!important;bottom:42px!important;
 margin:0!important;padding-top:28px!important;text-align:center!important;border-top:1px solid #cfc7b5!important;
}
.sheet.jpg-capture .report-footer img{width:86px!important;height:86px!important;object-fit:contain!important;margin-bottom:8px!important}
.sheet.jpg-capture .report-footer .footer-text{font-size:12px!important;letter-spacing:2px!important}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script></head>
<body>
<div class="actions">
<button class="back" onclick="history.back()">← 앱으로 돌아가기</button>
<button class="savebtn" id="jpgBtn" type="button">JPG 이미지 만들기</button>
</div>
<div id="saveStatus" class="save-status hidden"></div>
<article class="sheet">
<header class="top"><img class="logo" src="icon-512.png" alt="Wisdom Piano"><div><div class="kicker">PIANO LESSON REPORT</div><h1 id="student">학생 레슨 리포트</h1><div class="meta" id="meta"></div></div></header>
<div class="goldline"></div>
<section class="info">
<div class="cell"><span class="label">교재 / 진도</span><strong class="value" id="book">-</strong></div>
<div class="cell"><span class="label">연주곡</span><strong class="value" id="piece">-</strong></div>
<div class="cell"><span class="label">스케일 / 테크닉</span><strong class="value" id="tech">-</strong></div>
<div class="cell"><span class="label">완성도</span><strong class="value" id="progress">-</strong></div>
</section>
<section class="section"><h2>오늘의 레슨</h2><div class="box" id="note">-</div></section>
<section class="section"><h2>이번 주 연습 과제</h2><div class="box" id="homework">-</div></section>
<section class="section"><h2>다음 레슨 계획</h2><div class="box" id="next">-</div></section>
<footer class="footer"><div class="rule"></div><img src="icon-512.png" alt="Wisdom Piano"><div>WISDOM PIANO · MUSIC STUDIO</div></footer>
</article>
<script>
const r=JSON.parse(localStorage.getItem('wisdomPianoParentReport')||'{}');
const put=(id,v)=>document.getElementById(id).textContent=v||'-';
put('student',(r.student||'')+' 학생');
document.getElementById('meta').textContent=[r.date,r.attendance].filter(Boolean).join('  |  ');
put('book',r.book);put('piece',r.piece);put('tech',r.tech);put('progress',r.progress);
put('note',r.note);put('homework',r.homework);put('next',r.next);
function safeName(){
  const n=(r.student||'학생').replace(/[\\/:*?"<>|]/g,'_');
  const d=(r.date||'레슨').replace(/[\\/:*?"<>|]/g,'_');
  return `Wisdom_Piano_${n}_${d}`;
}
function status(msg){
  const el=document.getElementById('saveStatus');
  el.textContent=msg; el.classList.remove('hidden');
}
function hideStatus(){document.getElementById('saveStatus').classList.add('hidden')}
function downloadBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
async function makeCanvas(){
 status('JPG 리포트를 만드는 중입니다…');
 const sheet=document.querySelector('.sheet');
 sheet.classList.add('jpg-capture');
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 try{
  return await html2canvas(sheet,{scale:1,backgroundColor:'#ffffff',useCORS:true,width:1240,height:1754,windowWidth:1240,windowHeight:1754,scrollX:0,scrollY:0});
 }finally{sheet.classList.remove('jpg-capture');}
}
document.getElementById('jpgBtn').onclick=async function(){
  try{
    const c=await makeCanvas();
    c.toBlob(b=>{downloadBlob(b,safeName()+'.jpg');status('JPG 파일을 만들었습니다.');setTimeout(hideStatus,1800)},'image/jpeg',0.98);
  }catch(e){status('JPG 생성 중 오류가 발생했습니다. 다시 시도해 주세요.')}
};

</script>
</body></html>
